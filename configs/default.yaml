# =============================================================================
# hooptrack — default configuration
# Every knob of the pipeline lives here so experiments are reproducible:
# an ablation is just a copy of this file with one value changed.
# =============================================================================

data:
  root: data/SportsMOT/dataset     # where scripts/download_data.py extracts the sequences
  split: val                       # train | val  (test has no public ground truth)
  sport: basketball                # filter applied with splits_txt/basketball.txt
  splits_dir: data/SportsMOT/splits_txt
  only: null                       # optional list of sequence names (quick demos)

detector:
  # "yolo"   -> run a YOLO model on every frame
  # "cached" -> read detections previously saved with scripts/run_detector.py
  # "gt"     -> oracle: ground-truth boxes (+ optional noise). Isolates the
  #             association quality from the detector quality (ablation).
  type: yolo
  weights: yolo11m.pt              # COCO-pretrained; swap for your fine-tuned weights
  conf: 0.10                       # keep LOW: the tracker's 2nd stage uses low-score boxes
  iou: 0.70                        # NMS IoU
  imgsz: 1280                      # broadcast frames are 1280x720: players are small
  device: null                     # null = auto (cuda if available)
  cache_dir: outputs/detections

# --- post-detection filters (experiment 003) -----------------------------------
# Remove people who are not players BEFORE ReID and tracking.
# Experiment 003: -79 % false positives, no player lost, IDF1 37.8 -> 56.6.
# The code default is off, so configs written before 003 reproduce their runs.
filters:
  court_mask: true                 # keep only boxes whose feet are on the playing surface
  court_mask_params:
    downscale: 2                   # compute the mask at half resolution
    hue_tol: 12                    # colour tolerance around the estimated floor colour
    sat_tol: 70
    min_value: 60
    min_area_frac: 0.15            # floor must cover >= 15 % of the frame, else no filtering
    margin: 0.15                   # feet may be outside the court by 15 % of the box height
    reuse_frames: 25               # reuse the last good mask during short failures

# --- team / referee classifier (experiment 006) --------------------------------
# Unsupervised jersey-colour clustering per video: team A / team B / other.
# Off by default until 006 shows a gain (see experiments/006_team_gate).
teams:
  enabled: false
  warmup_frames: 60                # frames used to fit the 3 colour clusters
  min_samples: 60
  confidence_ratio: 0.7            # d(nearest)/d(2nd) below this -> label, else unknown
  min_score: 0.5
  max_coverage: 0.2                # only clean crops are labelled
  other_count_ratio: 0.8           # "other" cluster must be clearly the smallest
  label_occluded: false            # 006b: also label occluded boxes from their visible torso
  min_visible: 0.4                 # ... if at least 40 % of the torso is not hidden

reid:
  # "osnet"     -> torchreid OSNet-x1.0 (best; needs `pip install torchreid`)
  # "resnet"    -> torchvision ResNet-50 ImageNet features (no extra install)
  # "histogram" -> HSV colour histogram (no DL; fast baseline / CI)
  # "none"      -> pure motion tracker (ByteTrack-like) for the ablation
  #
  # 004a: with appearance as a hard veto, ResNet ReID added 14 ID switches and
  # motion + GMC alone was best (IDF1 58.2, 52 FPS).
  # 005a: with the veto limited to ambiguous motion (appearance_veto_max_iou),
  # ReID + memory beats it: IDF1 60.5, HOTA 58.3, 34 switches — at ~3 FPS on CPU.
  # Real-time alternative: --set reid.type=none tracker.memory_enabled=false
  type: resnet
  weights: null
  batch_size: 64
  device: null
  # Experiment 002: embed only boxes whose appearance the tracker can use
  # (score >= min(high_thresh, feature_update_min_score)). Verified: identical
  # tracks, ReID 3.7x faster. The code default stays false (001 reproducible).
  only_usable_boxes: true

tracker:
  # --- detection gating -----------------------------------------------------
  high_thresh: 0.50          # 1st association stage uses detections above this
  low_thresh: 0.10           # 2nd stage recovers occluded players with low scores
  new_track_thresh: 0.60     # only confident, unmatched boxes may spawn a new identity

  # --- association ------------------------------------------------------------
  match_thresh: 0.80         # max fused cost accepted in stage 1 (1 - similarity)
  second_match_thresh: 0.50  # stricter IoU-only threshold for stage 2
  tentative_match_thresh: 0.70  # stage 3: a fresh hypothesis needs IoU > 0.3
  appearance_weight: 0.50    # lambda in  cost = lambda*app + (1-lambda)*motion
  appearance_gate: 0.35      # reject pairs whose cosine distance exceeds this
  appearance_veto_max_iou: 0.5   # 005a: appearance may only veto pairs with IoU below this
                                 # (.inf = veto at any IoU, the behaviour up to 004a)
  iou_gate: 0.20             # ... or whose IoU is below this (unless app is very close)
  ema_alpha: 0.90            # smoothing of each track's appearance embedding
  feature_update_min_score: 0.60  # only learn appearance from clean, confident boxes

  # --- life cycle ---------------------------------------------------------------
  min_hits: 2                # frames before a tentative track is confirmed
  max_time_lost: 60          # frames a lost track is kept "warm" (Kalman-predicted)
  reacquire_speed: 1.5       # stage 4 gate: body-heights per second a lost player may drift

  # --- long-term re-identification memory ---------------------------------------
  # Tracks that exceed max_time_lost are moved to a gallery instead of being
  # deleted. New confident detections are compared against the gallery BEFORE
  # a new ID is created: this is what prevents identity substitution when a
  # player leaves the frame and comes back.
  memory_enabled: true       # 005a: -1 switch, 49 -> 42 ids created (needs reid.type != none)
  memory_max_age: 900        # frames (30 s @ 30 fps)
  memory_thresh: 0.25        # max cosine distance to revive an identity
  memory_margin: 0.05        # best match must beat 2nd best by this (ambiguity guard)
  memory_gallery_size: 30    # embeddings kept per identity (diverse poses)
  memory_wait: 15            # a new track born from an occluded crop waits up to N
                             # frames for a clean crop before minting a new id

  # --- camera motion compensation -------------------------------------------------
  # Broadcast cameras pan and zoom constantly: without compensation the Kalman
  # prediction drifts and IoU collapses. "sparse" = optical flow + affine RANSAC.
  gmc: sparse                # sparse | none
  gmc_downscale: 2

  # --- team constraints (experiment 006; need teams.enabled) ------------------------
  team_gate: false           # forbid cross-team matches when IoU < team_gate_max_iou, and in re-id
  team_gate_max_iou: 0.5
  team_cost: 0.0             # 006c: soft version: extra stage-1 cost for cross-team pairs
  suppress_other: false      # hide tracks whose majority label is "other" (referees)
  team_min_votes: 3          # confident labels a track needs before it has a team
  team_min_share: 0.6        # ... and the share of the majority label

output:
  dir: outputs/runs/default
  save_video: false
